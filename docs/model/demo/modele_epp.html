<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="utf-8"/>
    <title>Modèle météo en eau peu profonde</title>    
    <script src="js/vendor/jquery-1.11.2.min.js"></script>
    <script src="js/mb_meteo_epp.js"></script>
    <script src="js/mb_meteo_epp_main.js"></script>
<script>
$(document).ready(function () {
    atmos.projection = atmos.PROJ_CARTESIEN;
    atmos.fieldFiltering = $("#filtering").is(':checked');
    atmos.width = 144;
    atmos.height = 72;
    atmos.dt = 360;
    atmos.dlat = 1;
    atmos.dlon = 1;
    atmos.nlat = 80;
    atmos.slat = atmos.nlat - atmos.height * atmos.dlon;
    atmos.elon = 40;
    atmos.wlon = atmos.elon - atmos.width * atmos.dlon;
    atmos.relaxation = 4;
    for (i = 0; i < valids.length; i++)
    {
        reslist.push("hgt_500_" + valids[i] + ".txt");
        reslist.push("ugrd_500_" + valids[i] + ".txt");
        reslist.push("vgrd_500_" + valids[i] + ".txt");
    }

    printLoadingStatus();
    $.ajax({
        url: "res/run/" + scenario + "/runinfo.txt",
        dataType: "text",
        success: function (data)
        {
            $("#runinit").html(data);
        }
    });
    $.ajax({
        url: "res/run/" + scenario + "/" + reslist[0],
        dataType: "text",
        success: onFieldDownload
    });
});

function onFieldDownload(data)
{
    var f = reslist[0].substring(0, 1);
    switch (f)
    {
        case "h":
            h500[h500.length] = [];
            loadField(h500[h500.length - 1], data, 0, 0);
            break;
        case "u":
            u500[u500.length] = [];
            loadField(u500[u500.length - 1], data, 0, 0);
            break;
        case "v":
            v500[v500.length] = [];
            loadField(v500[v500.length - 1], data, 0, 0);
            break;
    }
    reslist.shift();
    if (reslist.length > 0)
    {
        printLoadingStatus();
        $.ajax({
            url: "res/run/" + scenario + "/" + reslist[0],
            dataType: "text",
            success: onFieldDownload
        });
    } else
    {
        $(statistics).html("Prêt");
        status = "ready";
        reset();
    }
}
</script>
    <style>
        html, body {
            overflow: hidden;
            width   : 100%;
            height  : 100%;
            margin  : 0;
            padding : 0;
        }

        #renderCanvas {
            width   : 100%;
            height  : 100%;
            touch-action: none;
        }
        #result {
            overflow-x : auto;
        }
        td, th {
            min-width:12px;
            min-height:12px;
            text-align:center;
            font-size:50%;
        }
        table {
            border:0px none white;
            border-spacing: 0px;
        }
    </style>
</head>
<body>
